name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Unit tests (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode & available iPhone simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E 'iPhone' | head -10

      - name: Run unit tests
        run: |
          xcodebuild -project DatBikeSmartkey.xcodeproj -scheme DatBikeSmartkey \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test

  build-device:
    name: Device build (generic iOS, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build for generic iOS device
        run: |
          xcodebuild -project DatBikeSmartkey.xcodeproj -scheme DatBikeSmartkey \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath build/ci \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-device-log
          path: build/ci/Logs/Build/*.xcactivitylog
          if-no-files-found: ignore
