name: DatBikeSmartkey
options:
  bundleIdPrefix: com.smartkey
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "3"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

targets:
  DatBikeSmartkey:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: DatBikeSmartkey
        excludes:
          - "**/*.entitlements"
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mybike.smartkey
        INFOPLIST_FILE: DatBikeSmartkey/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "MH385VJBCB"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: false
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: false
        CODE_SIGN_ENTITLEMENTS: DatBikeSmartkey/DatBikeSmartkey.entitlements
      configs:
        Release:
          DEPLOYMENT_POSTPROCESSING: "YES"
          STRIP_INSTALLED_PRODUCT: "YES"
          STRIP_SWIFT_SYMBOLS: "YES"
          SWIFT_COMPILATION_MODE: "wholemodule"
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          GCC_SYMBOLS_PRIVATE_EXTERN: "YES"

