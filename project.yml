name: DatBikeSmartkey
options:
  bundleIdPrefix: com.smartkey
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "5.0.0"
    CURRENT_PROJECT_VERSION: "6"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

targets:
  DatBikeSmartkey:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: DatBikeSmartkey
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mybike.smartkey
        INFOPLIST_FILE: DatBikeSmartkey/Info.plist
        # QUAN TRỌNG: giữ nguyên tên product cũ — module Swift là D_SmartKey
        # (test dùng @testable import D_SmartKey).
        PRODUCT_NAME: "D-SmartKey"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "MH385VJBCB"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: false
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: false
        CODE_SIGN_ENTITLEMENTS: DatBikeSmartkey/DatBikeSmartkey.entitlements
      configs:
        Debug:
          ENABLE_TESTABILITY: "YES"
        Release:
          DEPLOYMENT_POSTPROCESSING: "YES"
          STRIP_INSTALLED_PRODUCT: "YES"
          STRIP_SWIFT_SYMBOLS: "YES"
          SWIFT_COMPILATION_MODE: "wholemodule"
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          GCC_SYMBOLS_PRIVATE_EXTERN: "YES"

  DatBikeSmartkeyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: DatBikeSmartkeyTests
    dependencies:
      - target: DatBikeSmartkey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mybike.smartkey.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "MH385VJBCB"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/D-SmartKey.app/D-SmartKey"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  DatBikeSmartkey:
    build:
      targets:
        DatBikeSmartkey: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DatBikeSmartkeyTests
