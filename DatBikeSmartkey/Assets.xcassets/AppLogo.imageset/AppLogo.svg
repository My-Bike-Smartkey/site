<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Dark gradient background for realism -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1B23"/>
      <stop offset="100%" stop-color="#0B0C10"/>
    </linearGradient>
    
    <!-- Neon orange gradient -->
    <linearGradient id="neonOrange" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3800"/>
      <stop offset="100%" stop-color="#FF9B00"/>
    </linearGradient>

    <!-- Neon cyan/blue gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0057FF"/>
    </linearGradient>

    <!-- Glowing effects -->
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Circle Shield -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGrad)" stroke="url(#neonCyan)" stroke-width="6" opacity="0.9" filter="url(#glowCyan)"/>

  <!-- High Tech Hexagon Frame -->
  <polygon points="256,60 410,150 410,360 256,450 102,360 102,150" fill="none" stroke="url(#neonCyan)" stroke-width="4" opacity="0.4"/>
  <polygon points="256,90 380,160 380,350 256,420 132,350 132,160" fill="none" stroke="url(#neonOrange)" stroke-width="2" opacity="0.8"/>

  <!-- Dynamic Electric Motorbike Profile -->
  <g transform="translate(60, 40)" filter="url(#glowOrange)">
    <!-- Back Wheel -->
    <circle cx="150" cy="280" r="35" fill="none" stroke="url(#neonOrange)" stroke-width="12" />
    <circle cx="150" cy="280" r="10" fill="url(#neonOrange)" />
    
    <!-- Front Wheel -->
    <circle cx="340" cy="280" r="35" fill="none" stroke="url(#neonOrange)" stroke-width="12" />
    <circle cx="340" cy="280" r="10" fill="url(#neonOrange)" />
    
    <!-- Bike Body (Cyberpunk/Angular) -->
    <path d="M 150 280 L 190 280 L 220 180 L 290 180 L 340 280 M 230 180 L 160 160 M 340 280 L 290 150 L 270 140" fill="none" stroke="url(#neonOrange)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Glowing Lightning Bolt overlay matching MyBike concept -->
  <g transform="translate(0, 50)" filter="url(#glowCyan)">
    <path d="M 280 80 L 210 240 L 260 240 L 230 400 L 330 200 L 280 200 Z" fill="url(#neonCyan)"/>
  </g>
</svg>
